<text x="378" y="296" text-anchor="middle" font-size="12" fill="#57606a">schedules, the sweep,</text>
<text x="378" y="310" text-anchor="middle" font-size="12" fill="#57606a">distributed lock</text>
<rect x="521" y="236" width="200" height="80" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
