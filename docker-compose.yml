# The whole system on one machine:
#
#   docker compose up --build                      services, dashboard, Postgres, Kafka, Jaeger
#   docker compose --profile observability up      plus Prometheus and Grafana
#   docker compose --profile tools up              plus Kafka UI
#
# Dashboard http://localhost:5173   API and Swagger UI http://localhost:4000
# Jaeger http://localhost:16686     Grafana http://localhost:3000   Kafka UI http://localhost:8090

x-java-service: &java-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  environment: &java-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    PUBLIC_API_URL: http://localhost:4000
    MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
  deploy:
    resources:
      limits:
        memory: 512m

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - ledger-postgres-data:/var/lib/postgresql/data
      # One database per service, the same split as production.
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL is for the containers, EXTERNAL for tools on the host.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - ledger-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"

  ledger-service:
    <<: *java-service
    build:
      context: services
      args:
        SERVICE: ledger-service
    environment:
      <<: *java-env
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger
      LEDGER_SEED_ENABLED: "true"

  recurring-transfer-service:
    <<: *java-service
    build:
      context: services
      args:
        SERVICE: recurring-transfer-service
    environment:
      <<: *java-env
      RECURRING_DB_URL: jdbc:postgresql://postgres:5432/recurring
      LEDGER_SERVICE_URL: http://ledger-service:8081
      RECURRING_SEED_ENABLED: "true"

  insights-service:
    <<: *java-service
    build:
      context: services
      args:
        SERVICE: insights-service
    environment:
      <<: *java-env
      INSIGHTS_DB_URL: jdbc:postgresql://postgres:5432/insights

  notification-service:
    <<: *java-service
    build:
      context: services
      args:
        SERVICE: notification-service
    environment:
      <<: *java-env
      NOTIFICATION_ALLOWED_ORIGINS: http://localhost:*

  api-gateway:
    <<: *java-service
    build:
      context: services
      args:
        SERVICE: api-gateway
    depends_on:
      - ledger-service
      - recurring-transfer-service
      - insights-service
      - notification-service
    ports:
      - "4000:4000"
    environment:
      <<: *java-env
      LEDGER_SERVICE_URL: http://ledger-service:8081
      RECURRING_SERVICE_URL: http://recurring-transfer-service:8082
      INSIGHTS_SERVICE_URL: http://insights-service:8083
      NOTIFICATION_SERVICE_WS_URL: ws://notification-service:8084
      CORS_ORIGIN: http://localhost:5173

  web:
    build:
      context: web
      args:
        VITE_API_URL: http://localhost:4000/api/v1
        VITE_WS_URL: ws://localhost:4000/ws
    ports:
      - "5173:8080"
    depends_on:
      - api-gateway

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [observability]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [tools]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ledger
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

volumes:
  ledger-postgres-data:
  ledger-kafka-data:
