<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Ledger</title>
  <!-- Built from the same pieces as the brand mark in the app header: the
       same 3px corner radius and the same accent gradient. The teal rule
       under the L is the ledger line, in the color the dashboard uses for
       a balance going up. Every shape is axis-aligned and at least 4 units
       thick, which is 2 solid pixels once this is drawn at 16px, so
       nothing turns to mush in a browser tab. -->
  <defs>
    <linearGradient id="tile" x1="6" y1="0" x2="26" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d6fff"/>
      <stop offset="1" stop-color="#8f91ff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="3" fill="url(#tile)"/>
  <path d="M10 5h4v11h8v4H10z" fill="#ffffff"/>
  <rect x="10" y="23" width="12" height="4" rx="1" fill="#19ceb3"/>
</svg>
