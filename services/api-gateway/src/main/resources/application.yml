# The one address clients use. Every route's upstream comes from an
# environment variable, so the same image runs on a laptop, in Compose and
# on Kubernetes, where these are plain service DNS names.

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 15s
          default-filters:
            # A service never sets CORS headers itself, but if one ever does,
            # the browser must still see each header only once.
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            - id: ledger
              uri: ${LEDGER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/accounts/**,/api/v1/transactions/**
            - id: recurring-transfers
              uri: ${RECURRING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/recurring-transfers/**
            - id: insights
              uri: ${INSIGHTS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/insights/**
            - id: live-updates
              uri: ${NOTIFICATION_SERVICE_WS_URL:ws://localhost:8084}
              predicates:
                - Path=/ws
            # Each service's OpenAPI document, fetched through the gateway so
            # one Swagger UI can show them all.
            - id: ledger-openapi
              uri: ${LEDGER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/openapi/ledger-service
              filters:
                - SetPath=/v3/api-docs
            - id: recurring-openapi
              uri: ${RECURRING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/openapi/recurring-transfer-service
              filters:
                - SetPath=/v3/api-docs
            - id: insights-openapi
              uri: ${INSIGHTS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/openapi/insights-service
              filters:
                - SetPath=/v3/api-docs

server:
  port: ${PORT:4000}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      # On every meter, so dashboards can split any metric by service.
      service: api-gateway

gateway:
  allowed-origins: ${CORS_ORIGIN:http://localhost:5173}
  jwt-enabled: ${GATEWAY_JWT_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls-primary-name: Ledger service
    urls:
      - name: Ledger service
        url: /openapi/ledger-service
      - name: Recurring transfer service
        url: /openapi/recurring-transfer-service
      - name: Insights service
        url: /openapi/insights-service
