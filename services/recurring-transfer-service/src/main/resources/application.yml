spring:
  application:
    name: recurring-transfer-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${RECURRING_DB_URL:jdbc:postgresql://localhost:5432/recurring}
    username: ${RECURRING_DB_USER:ledger}
    password: ${RECURRING_DB_PASSWORD:ledger}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    connect-retries: 30
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
    serviceclient:
      ledger:
        base-url: ${LEDGER_SERVICE_URL:http://localhost:8081}

server:
  port: ${PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      # On every meter, so dashboards can split any metric by service.
      service: recurring-transfer-service

ledger:
  outbox:
    enabled: true
  openapi:
    server-url: ${PUBLIC_API_URL:http://localhost:4000}

recurring:
  sweep:
    interval: ${SCHEDULER_INTERVAL:PT15S}
  seed:
    enabled: ${RECURRING_SEED_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.apache.kafka: WARN
