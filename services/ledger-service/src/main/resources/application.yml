# Defaults are for running on a laptop against `dev-infra` or the infra in
# deploy/docker-compose.yml. Containers override them with environment
# variables, for example SPRING_DATASOURCE_URL or KAFKA_BOOTSTRAP_SERVERS.

spring:
  application:
    name: ledger-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${LEDGER_DB_USER:ledger}
    password: ${LEDGER_DB_PASSWORD:ledger}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # Lets the service start alongside its database instead of failing
    # because Postgres took a few extra seconds to come up.
    connect-retries: 30
  transaction:
    default-timeout: 15s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    template:
      observation-enabled: true

server:
  port: ${PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      # Every request is traced because this is a demo. Production would
      # sample a fraction and keep every trace that contains an error.
      probability: 1.0
  metrics:
    tags:
      # On every meter, so dashboards can split any metric by service.
      service: ledger-service

ledger:
  outbox:
    enabled: true
  seed:
    enabled: ${LEDGER_SEED_ENABLED:false}
  openapi:
    server-url: ${PUBLIC_API_URL:http://localhost:4000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  level:
    org.apache.kafka: WARN
