name: Backend CI

# Builds and tests the Spring Boot services on every change to them, then
# builds each service's container image and scans it. The test suite needs
# nothing but a JDK: Postgres and Kafka run embedded inside the test JVM.

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit, slice, integration and architecture tests
        run: ./mvnw -B -ntp verify

      - name: Keep test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            services/*/target/surefire-reports/
            services/*/target/site/jacoco/
          retention-days: 14

  images:
    name: Image (${{ matrix.service }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - ledger-service
          - recurring-transfer-service
          - insights-service
          - notification-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built and loaded locally, not pushed. To publish to GHCR on merges to
      # main, add `packages: write`, log in with docker/login-action, and set
      # push to true for that branch.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: services
          build-args: SERVICE=${{ matrix.service }}
          tags: ghcr.io/amishpr/ledger/${{ matrix.service }}:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/amishpr/ledger/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
