name: Deploy demo to GitHub Pages

# Builds the in-browser demo (web/src/demo) and publishes it to GitHub
# Pages. Only the frontend is deployed, because Pages serves static files
# and the Express API needs a running Node process. See README.md.
#
# One-time setup in the repository: Settings, then Pages, then set
# "Source" to "GitHub Actions". Without that this workflow cannot deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it partway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # These cover the demo backend itself: the same accounting rules the
      # server suite checks, run against the implementation being deployed.
      - name: Test
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build demo
        run: npm run build:demo
        env:
          # "/repo-name" for a project site, empty for a custom domain or a
          # user site. vite.config.ts normalizes either into a valid base.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
