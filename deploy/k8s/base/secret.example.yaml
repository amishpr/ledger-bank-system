# Not applied by kustomization.yaml on purpose: real credentials come from
# the platform (External Secrets, Vault, or a sealed secret), never from git.
# Create it by hand for a test cluster:
#   kubectl -n ledger create secret generic ledger-db --from-literal=username=ledger --from-literal=password=...
apiVersion: v1
kind: Secret
metadata:
  name: ledger-db
type: Opaque
stringData:
  username: ledger
  password: change-me
