global:
  scrape_interval: 15s

scrape_configs:
  - job_name: ledger-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ledger-service:8081
          - recurring-transfer-service:8082
          - insights-service:8083
          - notification-service:8084
          - api-gateway:4000
